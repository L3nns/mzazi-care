services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-mzazi_care}
      MYSQL_USER: ${DB_USER:-mzazi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mzazipass}
    ports: ["3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      # Both files run once, in name order, the first time the volume is created.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mzazi_care}
      DB_USER: ${DB_USER:-mzazi}
      DB_PASSWORD: ${DB_PASSWORD:-mzazipass}
      MZAZI_DATA_SOURCE: ${MZAZI_DATA_SOURCE:-mysql}
      MZAZI_ENCODER: ${MZAZI_ENCODER:-auto}
      MZAZI_SBERT_MODEL: ${MZAZI_SBERT_MODEL:-all-MiniLM-L6-v2}
      MZAZI_K: ${MZAZI_K:-20}
      MZAZI_ALPHA: ${MZAZI_ALPHA:-0.4}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-dev-service-token}
      MZAZI_MODEL_PATH: /app/model/hybrid_model.joblib
    volumes:
      - model_data:/app/model
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mzazi_care}
      DB_USER: ${DB_USER:-mzazi}
      DB_PASSWORD: ${DB_PASSWORD:-mzazipass}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-dev-service-token}
      FRONTEND_DIR: /app/frontend
    volumes:
      - ./frontend:/app/frontend:ro
    ports: ["4000:4000"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  model_data:
