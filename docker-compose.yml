services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-mzazi_care}
      MYSQL_USER: ${DB_USER:-mzazi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mzazipass}
    ports: ["127.0.0.1:3307:3306"]   # host-only, for local tools
    volumes:
      - mysql_data:/var/lib/mysql
      # Both files run once, in name order, the first time the volume is created.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      # Over TCP on purpose: while the seed loads, the image runs a temporary
      # socket-only server that a plain ping would already call healthy.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 12

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mzazi_care}
      DB_USER: ${DB_USER:-mzazi}
      DB_PASSWORD: ${DB_PASSWORD:-mzazipass}
      MZAZI_DATA_SOURCE: ${MZAZI_DATA_SOURCE:-mysql}
      MZAZI_ENCODER: ${MZAZI_ENCODER:-auto}
      MZAZI_SBERT_MODEL: ${MZAZI_SBERT_MODEL:-all-MiniLM-L6-v2}
      MZAZI_K: ${MZAZI_K:-20}
      MZAZI_ALPHA: ${MZAZI_ALPHA:-auto}
      MZAZI_MIN_SIMILARITY: ${MZAZI_MIN_SIMILARITY:-auto}
      MZAZI_DIVERSITY_SHARE: ${MZAZI_DIVERSITY_SHARE:-0.2}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?set ML_SERVICE_TOKEN in .env}
      MZAZI_MODEL_PATH: /app/model/hybrid_model.joblib
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - model_data:/app/model
    ports: ["127.0.0.1:8000:8000"]   # host-only; browsers reach it through Express
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mzazi_care}
      DB_USER: ${DB_USER:-mzazi}
      DB_PASSWORD: ${DB_PASSWORD:-mzazipass}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?set ML_SERVICE_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      FRONTEND_DIR: /app/frontend
      UPLOAD_DIR: /app/uploads
      OPENAPI_FILE: /app/openapi.yaml
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SEARCH_MODE: ${SEARCH_MODE:-semantic}
    volumes:
      - ./frontend:/app/frontend:ro
      - ./docs/api/openapi.yaml:/app/openapi.yaml:ro
      - uploads:/app/uploads
    ports: ["4000:4000"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  model_data:
  uploads:
