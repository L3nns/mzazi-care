<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search results · Mzazi Care</title>
<meta name="description" content="Find trusted maternal and childcare services in Nairobi.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header"><div class="container nav">
  <a class="brand" href="index.html">MZAZI CARE</a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="search.html">Browse services</a>
  </nav>
  <div class="nav-actions" id="nav-actions"></div>
</div></header>
<main class="container">
  <form class="search-bar" id="search-form" style="margin-top:1rem">
    <div><label for="q">Search</label><input id="q" placeholder="Search services"></div>
    <div><button class="btn" type="submit" style="width:100%">Search</button></div>
  </form>

  <div class="layout search-layout">
    <aside class="panel" id="filters">
      <h2>Filter results</h2>
      <div class="field"><label for="f-category">Service category</label><select id="f-category"></select></div>
      <div class="field"><label for="f-location">Location</label><select id="f-location"></select></div>
      <div class="field"><label for="f-sort">Sort by</label>
        <select id="f-sort">
          <option value="relevance">Relevance</option>
          <option value="name">Name</option>
          <option value="newest">Newest</option>
          <option value="popular">Most viewed</option>
        </select></div>
      <button class="btn secondary small" id="clear-filters" type="button">Clear all</button>
      <p class="muted" style="margin-top:.8rem">Only verified providers are listed.</p>
    </aside>

    <section>
      <h1 id="result-count">Searching…</h1>
      <div id="results"></div>
      <div class="pagination" id="pagination"></div>
    </section>

    <aside class="panel rec-panel" id="rec-panel">
      <h2>Recommended for you</h2>
      <p class="strategy-note">Loading…</p>
      <div class="rec-list"></div>
    </aside>
  </div>
</main>
<footer style="border-top:1px solid var(--line);margin-top:2rem;padding:1.25rem 0;background:#fff">
  <div class="container muted">Mzazi Care Discovery &amp; Catalog System · capstone prototype · seeded with synthetic data</div>
</footer>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script></body></html>
