name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  ml:
    name: ML tests and research scripts
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml-service } }
    env:
      # The unit tests use the light encoder; the full-stack job below runs the
      # sentence-transformer one that ships.
      MZAZI_ENCODER: tfidf
    steps:
      - uses: actions/checkout@v4
      # job-level `env:` cannot reference the `runner` context (only steps
      # can), so paths under the runner's temp directory are resolved here
      # and exported to $GITHUB_ENV for every later step in this job.
      - name: Resolve runner-dependent paths
        run: echo "MZAZI_MODEL_DIR=$RUNNER_TEMP/model" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install (without sentence-transformers)
        run: |
          grep -v '^sentence-transformers' requirements.txt > "$RUNNER_TEMP/requirements-light.txt"
          pip install -r "$RUNNER_TEMP/requirements-light.txt"
      - run: python -m pytest -q
      - name: Research scripts still run (TF-IDF; numbers are not compared)
        run: python -m research.run_all --encoder tfidf

  full-stack:
    name: Full stack (MySQL, ML service, API, browser)
    needs: [backend, ml]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: mzazi_care
      ML_SERVICE_URL: http://127.0.0.1:8000
      ML_SERVICE_TOKEN: ci-service-token
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      MZAZI_DATA_SOURCE: mysql
      MZAZI_ENCODER: sbert
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      # job-level `env:` cannot reference the `runner` context (only steps
      # can), so paths under the runner's temp directory are resolved here
      # and exported to $GITHUB_ENV for every later step in this job.
      - name: Resolve runner-dependent paths
        run: |
          echo "MZAZI_MODEL_DIR=$RUNNER_TEMP/model" >> "$GITHUB_ENV"
          echo "MZAZI_MODEL_PATH=$RUNNER_TEMP/model/hybrid_model.joblib" >> "$GITHUB_ENV"
          echo "HF_HOME=$RUNNER_TEMP/hf" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            e2e/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Cache the sentence-transformer model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hf
          key: hf-all-MiniLM-L6-v2

      - name: Load schema and seed
        run: |
          mysql -h 127.0.0.1 -uroot -proot < database/schema.sql
          mysql -h 127.0.0.1 -uroot -proot < database/seed_data.sql
          # The seed must load as UTF-8 ("crèche", not "cr├¿che").
          n=$(mysql -h 127.0.0.1 -uroot -proot -N -e \
            "SELECT COUNT(*) FROM mzazi_care.providers WHERE service_description LIKE '%crèche%'")
          test "$n" -gt 0 || { echo "seed text was mangled on import"; exit 1; }

      - name: Install the ML service (CPU-only PyTorch)
        working-directory: ml-service
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Install the backend and the browser tests
        run: |
          (cd backend && npm ci)
          (cd e2e && npm ci && npx playwright install --with-deps chromium)

      - name: Start the ML service
        working-directory: ml-service
        run: nohup python -m uvicorn app:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/ml.log" 2>&1 &
      - name: Start the API (runs the migrations)
        working-directory: backend
        run: nohup node server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Wait until the model is trained and the API sees it
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:4000/api/health | grep -q '"model_loaded":true'; then
              echo "ready after $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          echo "stack did not become ready"; tail -50 "$RUNNER_TEMP/ml.log" "$RUNNER_TEMP/backend.log"; exit 1

      - name: Integration smoke (API to the real ML service)
        working-directory: backend
        run: node tests/integration.smoke.js
      - name: Browser tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:4000
          E2E_WRITE: '1'
        run: npx playwright test

      - name: Keep logs and the browser report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-logs
          path: |
            ${{ runner.temp }}/ml.log
            ${{ runner.temp }}/backend.log
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
